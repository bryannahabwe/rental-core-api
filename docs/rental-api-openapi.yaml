openapi: 3.0.3
info:
  title: Rental Management API — RentFlow
  description: |
    Multi-tenant SaaS API for rental property management in Uganda.

    ## Authentication
    All endpoints except `/auth/register`, `/auth/login`, and `/auth/refresh`
    require a Bearer JWT token:
    ```
    Authorization: Bearer <access_token>
    ```

    ## Token Expiry
    - Access tokens expire after 24 hours.
    - On 401, the frontend Axios interceptor checks if the refresh token is expired.
    - If refresh token is still valid → silent refresh via `/auth/refresh`, retry original request.
    - If refresh token is also expired → `logout()` + redirect to `/login`.

    ## Pagination
    All list endpoints support: `page` (default 0), `size` (default 10),
    `sortBy` (default createdAt), `sortDir` (asc/desc, default desc).

    ## Billing Cycles
    Each agreement has a `billingDay` (1–28) derived automatically from
    `startDate` (day of month, capped at 28 to avoid February issues).
    Payments are recorded against exact cycle date ranges
    (`periodStartDate` to `periodEndDate`) rather than month/year numbers.

    Two billing models per agreement:
    - `ADVANCE` — tenant pays at the start of each cycle
    - `ARREARS` — tenant pays at the end of each cycle

    ## Balance Computation
    Outstanding balance is cumulative across ALL billing cycles, not just the current month.
    Unpaid previous months carry forward automatically.

    `currentCyclePaid` (Boolean) indicates whether the tenant has paid their
    current cycle specifically — based on payments whose periodStartDate/periodEndDate
    match the current cycle, not the payment recording date.

    ## Overpayment
    When a payment exceeds the expected amount, the excess is auto-applied
    as a ROLLOVER payment to the next cycle. Chains recursively if needed.

    ## Settings
    Each landlord has a settings row (auto-created with defaults on first GET).
    Settings control: company name, logo (Cloudinary), receipt prefix,
    receipt numbering (AUTO/MANUAL), receipt footer, and receipt style (DIGITAL/FORMAL).

  version: 5.0.0

servers:
  - url: http://localhost:8082/api/v1
    description: Local development
  - url: https://rental-api.askmoozo.com/api/v1
    description: Production

tags:
  - name: Auth
  - name: Tenants
  - name: Units
  - name: Agreements
  - name: Payments
  - name: Reports
  - name: Settings

paths:

  # ─── AUTH ──────────────────────────────────────────────

  /auth/register:
    post:
      tags: [ Auth ]
      summary: Register a new landlord
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
            example:
              name: Brian Nahabwe
              phoneNumber: "256774010511"
              password: secret123
      responses:
        '200':
          description: Registration successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          $ref: '#/components/responses/BadRequest'

  /auth/login:
    post:
      tags: [ Auth ]
      summary: Login with phone number or email
      description: |
        Returns accessToken, refreshToken, name, phoneNumber, email.
        Frontend stores in authStore (Zustand + localStorage).
        Frontend also immediately fetches GET /settings after login to populate settingsStore.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            examples:
              phone:
                value: { username: "256774010511", password: secret123 }
              email:
                value: { username: brian@example.com, password: secret123 }
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          $ref: '#/components/responses/BadRequest'

  /auth/refresh:
    post:
      tags: [ Auth ]
      summary: Refresh access token
      description: |
        Exchange a valid refresh token for a new access token.
        Called automatically by the Axios response interceptor on 401.
        The interceptor checks isRefreshTokenExpired() before calling this —
        if the refresh token is already expired it skips directly to logout().
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          description: New access token issued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          $ref: '#/components/responses/BadRequest'

  # ─── TENANTS ───────────────────────────────────────────

  /tenants:
    get:
      tags: [ Tenants ]
      summary: List all tenants with cumulative balance
      description: |
        Returns paginated tenants, each enriched with balance data from their active agreement.

        **Balance computation (TenantService.enrichWithBalance):**
        1. Find active agreement
        2. cyclesElapsed = BillingCycleUtils.cyclesElapsed(agreement)
        3. totalEverOwed = rentAmount × cyclesElapsed
        4. openingCredit = max(0, openingBalance); openingArrears = abs(min(0, openingBalance))
        5. totalEverOwed = totalEverOwed - openingCredit + openingArrears
        6. totalEverPaid = sumAllByAgreement(agreementId)
        7. outstanding = max(0, totalEverOwed - totalEverPaid)
        8. currentCyclePaid = sumByAgreementAndCycle(agreementId, cycleStart, cycleEnd) >= rentAmount

        If tenant has no active agreement, all balance fields return null.
      security:
        - BearerAuth: [ ]
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - $ref: '#/components/parameters/SortBy'
        - $ref: '#/components/parameters/SortDir'
        - name: search
          in: query
          schema:
            type: string
          description: Partial match on name, phone, or email
      responses:
        '200':
          description: Paginated tenants with balance
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagedTenantResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

    post:
      tags: [ Tenants ]
      summary: Create a tenant
      security:
        - BearerAuth: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TenantRequest'
            example:
              name: Jane Namukasa
              phone: "0772000001"
              email: jane@example.com
              address: Kamwokya, Kampala
      responses:
        '201':
          description: Tenant created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /tenants/{id}:
    get:
      tags: [ Tenants ]
      summary: Get a single tenant with cumulative balance
      security:
        - BearerAuth: [ ]
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Tenant found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

    put:
      tags: [ Tenants ]
      summary: Update a tenant
      security:
        - BearerAuth: [ ]
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TenantRequest'
      responses:
        '200':
          description: Tenant updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

    delete:
      tags: [ Tenants ]
      summary: Delete a tenant
      security:
        - BearerAuth: [ ]
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '204':
          description: Deleted
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  # ─── UNITS ─────────────────────────────────────────────

  /units:
    get:
      tags: [ Units ]
      summary: List all units (paginated + search + availability filter)
      security:
        - BearerAuth: [ ]
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - $ref: '#/components/parameters/SortBy'
        - $ref: '#/components/parameters/SortDir'
        - name: search
          in: query
          schema:
            type: string
        - name: isAvailable
          in: query
          schema:
            type: boolean
          description: true = available only, false = occupied only, omit = all
      responses:
        '200':
          description: Paginated units
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagedUnitResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

    post:
      tags: [ Units ]
      summary: Create a unit
      security:
        - BearerAuth: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RentalUnitRequest'
            example:
              roomNumber: A1
              description: Self-contained, ground floor
              rentAmount: 350000
              isAvailable: true
      responses:
        '201':
          description: Unit created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RentalUnitResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /units/{id}:
    get:
      tags: [ Units ]
      summary: Get a unit
      security:
        - BearerAuth: [ ]
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Unit found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RentalUnitResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

    put:
      tags: [ Units ]
      summary: Update a unit
      security:
        - BearerAuth: [ ]
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RentalUnitRequest'
      responses:
        '200':
          description: Unit updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RentalUnitResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

    delete:
      tags: [ Units ]
      summary: Delete a unit
      security:
        - BearerAuth: [ ]
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '204':
          description: Deleted
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  # ─── AGREEMENTS ────────────────────────────────────────

  /agreements:
    get:
      tags: [ Agreements ]
      summary: List all agreements (paginated + search + status filter)
      security:
        - BearerAuth: [ ]
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - $ref: '#/components/parameters/SortBy'
        - $ref: '#/components/parameters/SortDir'
        - name: search
          in: query
          schema:
            type: string
          description: Partial match on tenant name or room number
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/AgreementStatus'
      responses:
        '200':
          description: Paginated agreements
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagedAgreementResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

    post:
      tags: [ Agreements ]
      summary: Create an agreement
      description: |
        Creates an agreement linking a tenant to a unit.

        **billingDay** is derived automatically from `startDate` (day of month, capped at 28).
        Never sent by client — always computed server-side.

        **billingModel** defaults to ADVANCE if not provided.

        **NEW tenant** — startDate required, openingBalance defaults to 0.

        **EXISTING tenant** — set `startDate` to the first billing cycle you want
        the system to track going forward. Set `openingBalance` to:
        - Negative = total unpaid amount before startDate (arrears)
        - Positive = amount paid ahead before startDate (credit)

        Example: ARREARS tenant onboarding on Apr 15, owes 3 months × 180,000:
        - startDate = 2026-04-15
        - openingBalance = -540000
        - billingModel = ARREARS
      security:
        - BearerAuth: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RentalAgreementRequest'
            examples:
              new_tenant_advance:
                summary: New tenant — ADVANCE billing
                value:
                  tenantId: 3fa85f64-5717-4562-b3fc-2c963f66afa6
                  unitId: 6ba7b810-9dad-11d1-80b4-00c04fd430c8
                  tenantType: NEW
                  billingModel: ADVANCE
                  startDate: "2026-04-01"
                  rentAmount: 350000
                  depositAmount: 700000
              new_tenant_arrears:
                summary: New tenant — ARREARS billing
                value:
                  tenantId: 3fa85f64-5717-4562-b3fc-2c963f66afa6
                  unitId: 6ba7b810-9dad-11d1-80b4-00c04fd430c8
                  tenantType: NEW
                  billingModel: ARREARS
                  startDate: "2026-04-15"
                  rentAmount: 180000
              existing_in_arrears:
                summary: Existing tenant — owes 3 months
                value:
                  tenantId: 3fa85f64-5717-4562-b3fc-2c963f66afa6
                  unitId: 6ba7b810-9dad-11d1-80b4-00c04fd430c8
                  tenantType: EXISTING
                  billingModel: ADVANCE
                  startDate: "2026-04-15"
                  openingBalance: -540000
              existing_paid_ahead:
                summary: Existing tenant — paid ahead
                value:
                  tenantId: 3fa85f64-5717-4562-b3fc-2c963f66afa6
                  unitId: 6ba7b810-9dad-11d1-80b4-00c04fd430c8
                  tenantType: EXISTING
                  billingModel: ADVANCE
                  startDate: "2026-04-01"
                  openingBalance: 350000
      responses:
        '201':
          description: Agreement created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RentalAgreementResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /agreements/{id}:
    get:
      tags: [ Agreements ]
      summary: Get an agreement
      security:
        - BearerAuth: [ ]
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Agreement found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RentalAgreementResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

    put:
      tags: [ Agreements ]
      summary: Update an agreement
      description: |
        Updatable fields: rentAmount, depositAmount, startDate, billingModel, openingBalance.
        billingDay is re-derived from startDate if startDate changes.
        tenantId and unitId cannot be changed after creation.
      security:
        - BearerAuth: [ ]
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RentalAgreementRequest'
            example:
              tenantId: 3fa85f64-5717-4562-b3fc-2c963f66afa6
              unitId: 6ba7b810-9dad-11d1-80b4-00c04fd430c8
              billingModel: ARREARS
              startDate: "2026-04-15"
              rentAmount: 200000
              openingBalance: -540000
      responses:
        '200':
          description: Agreement updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RentalAgreementResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /agreements/{id}/moveout:
    patch:
      tags: [ Agreements ]
      summary: Record move-out and terminate agreement
      description: |
        Sets moveOutDate, changes status to TERMINATED, marks unit as available (isAvailable = true).
        Skips startDate comparison if startDate is null.
      security:
        - BearerAuth: [ ]
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MoveOutRequest'
            example:
              moveOutDate: "2026-06-30"
      responses:
        '200':
          description: Agreement terminated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RentalAgreementResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  # ─── PAYMENTS ──────────────────────────────────────────

  /payments:
    get:
      tags: [ Payments ]
      summary: List all payments (paginated + search + date filter)
      security:
        - BearerAuth: [ ]
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - $ref: '#/components/parameters/SortBy'
        - $ref: '#/components/parameters/SortDir'
        - name: search
          in: query
          schema:
            type: string
          description: Partial match on tenant name, room number, or reference
        - name: from
          in: query
          schema:
            type: string
            format: date
          description: Filter by paymentDate >= from (inclusive). Use with `to`.
        - name: to
          in: query
          schema:
            type: string
            format: date
          description: Filter by paymentDate <= to (inclusive). Use with `from`.
        - name: tenantId
          in: query
          schema:
            type: string
            format: uuid
        - name: agreementId
          in: query
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Paginated payments
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagedPaymentResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

    post:
      tags: [ Payments ]
      summary: Record a payment
      description: |
        Records a payment for a specific billing cycle.

        **Period dates:** Must match the agreement's billing cycle exactly.
        The frontend cycle picker generates these based on `billingDay`.

        **Overpayment:** If `amount > expectedAmount`, excess auto-creates a ROLLOVER
        payment for the next cycle. Chains recursively across months.

        **Split payments:** Multiple payments per cycle allowed. System sums them.

        **Period status** (computed, never stored):
        - PAID — totalPaidForPeriod >= expectedAmount
        - PARTIAL — 0 < totalPaidForPeriod < expectedAmount
        - ROLLOVER — source = ROLLOVER (auto-created by system)
      security:
        - BearerAuth: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentRequest'
            examples:
              full_payment_mid_month:
                summary: Full payment — billing_day = 15
                value:
                  agreementId: 3fa85f64-5717-4562-b3fc-2c963f66afa6
                  paymentDate: "2026-04-15"
                  amount: 180000
                  method: CASH
                  periodStartDate: "2026-04-15"
                  periodEndDate: "2026-05-14"
                  reference: "40422387417"
              full_payment_calendar:
                summary: Full payment — billing_day = 1
                value:
                  agreementId: 3fa85f64-5717-4562-b3fc-2c963f66afa6
                  paymentDate: "2026-04-01"
                  amount: 180000
                  method: CASH
                  periodStartDate: "2026-04-01"
                  periodEndDate: "2026-04-30"
              overpayment:
                summary: Overpayment — covers two cycles
                value:
                  agreementId: 3fa85f64-5717-4562-b3fc-2c963f66afa6
                  paymentDate: "2026-04-01"
                  amount: 360000
                  method: CASH
                  periodStartDate: "2026-04-01"
                  periodEndDate: "2026-04-30"
              partial:
                summary: Partial payment
                value:
                  agreementId: 3fa85f64-5717-4562-b3fc-2c963f66afa6
                  paymentDate: "2026-04-01"
                  amount: 100000
                  method: CASH
                  periodStartDate: "2026-04-01"
                  periodEndDate: "2026-04-30"
                  notes: Balance to follow end of month
      responses:
        '201':
          description: Payment recorded. ROLLOVER auto-created if overpaid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /payments/{id}:
    get:
      tags: [ Payments ]
      summary: Get a single payment
      security:
        - BearerAuth: [ ]
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Payment found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  # ─── REPORTS ───────────────────────────────────────────

  /reports/summary:
    get:
      tags: [ Reports ]
      summary: Dashboard summary statistics
      security:
        - BearerAuth: [ ]
      responses:
        '200':
          description: Summary stats
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SummaryResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /reports/payments:
    get:
      tags: [ Reports ]
      summary: Payment report for a date range
      security:
        - BearerAuth: [ ]
      parameters:
        - name: from
          in: query
          schema:
            type: string
            format: date
          example: "2026-04-01"
        - name: to
          in: query
          schema:
            type: string
            format: date
          example: "2026-04-30"
      responses:
        '200':
          description: Payment report
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentReportResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /reports/occupancy:
    get:
      tags: [ Reports ]
      summary: Occupancy rate
      security:
        - BearerAuth: [ ]
      responses:
        '200':
          description: Occupancy report
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OccupancyReportResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  # ─── SETTINGS ──────────────────────────────────────────

  /settings:
    get:
      tags: [ Settings ]
      summary: Get landlord settings
      description: |
        Returns the landlord's settings. Auto-creates a row with defaults if none exist yet.
        Called immediately after login — response stored in frontend settingsStore (Zustand).
        Used for branding (company name, logo) and receipt generation.
      security:
        - BearerAuth: [ ]
      responses:
        '200':
          description: Settings returned (or auto-created with defaults)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LandlordSettingsResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

    put:
      tags: [ Settings ]
      summary: Update landlord settings
      description: |
        Updates text fields. Logo is updated separately via POST /settings/logo.
        All fields are optional — only provided fields are updated.
      security:
        - BearerAuth: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LandlordSettingsRequest'
            examples:
              business_profile:
                summary: Update business profile
                value:
                  companyName: Nahabwe Properties
                  address: "Kyebando, Nansana, Kampala"
              receipt_settings:
                summary: Update receipt settings
                value:
                  receiptPrefix: RCP
                  nextReceiptNo: 1954
                  receiptNumbering: MANUAL
                  receiptFooter: Thank you for your business
                  receiptStyle: FORMAL
      responses:
        '200':
          description: Settings updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LandlordSettingsResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /settings/logo:
    post:
      tags: [ Settings ]
      summary: Upload company logo
      description: |
        Uploads logo to Cloudinary via fileStorageService.upload(file, "landlord/logo", landlordId).
        Uses landlordId as public_id so re-uploads overwrite the previous logo.
        Stores the returned Cloudinary secure_url in landlord_settings.logo_url.
        Frontend displays logo in sidebar (desktop) and avatar dropdown (mobile).
      security:
        - BearerAuth: [ ]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [ file ]
              properties:
                file:
                  type: string
                  format: binary
                  description: Image file (PNG, JPG, SVG). Max 5MB.
      responses:
        '200':
          description: Logo uploaded. Returns updated settings with new logoUrl.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LandlordSettingsResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /settings/receipt-number:
    post:
      tags: [ Settings ]
      summary: Get and increment next receipt number
      description: |
        Returns the next receipt number as a formatted string (e.g. "RCP-001")
        and increments next_receipt_no in the database atomically.
        Called each time a receipt is downloaded — both after recording a payment
        and when generating a manual receipt.
        Format: {receiptPrefix}-{nextReceiptNo zero-padded to 3 digits}
        Example: prefix="RCP", nextReceiptNo=1954 → "RCP-1954"
      security:
        - BearerAuth: [ ]
      responses:
        '200':
          description: Next receipt number (e.g. "RCP-001")
          content:
            application/json:
              schema:
                type: string
                example: RCP-001
        '401':
          $ref: '#/components/responses/Unauthorized'

# ─── COMPONENTS ────────────────────────────────────────

components:

  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    Id:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    Page:
      name: page
      in: query
      schema:
        type: integer
        default: 0
    Size:
      name: size
      in: query
      schema:
        type: integer
        default: 10
    SortBy:
      name: sortBy
      in: query
      schema:
        type: string
        default: createdAt
    SortDir:
      name: sortDir
      in: query
      schema:
        type: string
        enum: [ asc, desc ]
        default: desc

  responses:
    BadRequest:
      description: Validation or business rule error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            error: BAD_REQUEST
            message: Unit A1 already has an active agreement
    Unauthorized:
      description: Missing, invalid, or expired JWT token
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            error: UNAUTHORIZED
            message: Invalid or expired token

  schemas:

    # ── Auth ────────────────────────────────────────────

    RegisterRequest:
      type: object
      required: [ name, phoneNumber, password ]
      properties:
        name:
          type: string
          example: Brian Nahabwe
        phoneNumber:
          type: string
          example: "256774010511"
        email:
          type: string
          format: email
          nullable: true
        password:
          type: string
          minLength: 6

    LoginRequest:
      type: object
      required: [ username, password ]
      properties:
        username:
          type: string
          description: Phone number or email address
          example: "256774010511"
        password:
          type: string

    RefreshRequest:
      type: object
      required: [ refreshToken ]
      properties:
        refreshToken:
          type: string

    AuthResponse:
      type: object
      properties:
        accessToken:
          type: string
          description: JWT access token. Expires in 24 hours.
        refreshToken:
          type: string
          description: JWT refresh token. Expires in 30 days.
        name:
          type: string
          example: Brian Nahabwe
        phoneNumber:
          type: string
          example: "256774010511"
        email:
          type: string
          nullable: true

    # ── Tenants ─────────────────────────────────────────

    TenantRequest:
      type: object
      required: [ name, phone ]
      properties:
        name:
          type: string
        phone:
          type: string
        email:
          type: string
          nullable: true
        address:
          type: string
          nullable: true

    TenantResponse:
      type: object
      description: |
        Tenant enriched with balance data from active agreement.
        All balance/cycle fields are null if tenant has no active agreement.
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        phone:
          type: string
        email:
          type: string
          nullable: true
        address:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        currentUnit:
          type: string
          nullable: true
          description: Room number from active agreement
          example: A3
        monthlyRent:
          type: number
          format: decimal
          nullable: true
        currentBalance:
          type: number
          format: decimal
          nullable: true
          description: |
            Cumulative outstanding across ALL due cycles.
            0 = fully paid up. Positive = owes money. Null = no active agreement.
        periodStatus:
          type: string
          nullable: true
          enum: [ PAID, PARTIAL, UNPAID ]
          description: Status based on cumulative balance, not just current cycle.
        currentCycleStart:
          type: string
          format: date
          nullable: true
          description: Start of current billing cycle. e.g. 2026-04-15
        currentCycleEnd:
          type: string
          format: date
          nullable: true
          description: End of current billing cycle. e.g. 2026-05-14
        currentCyclePaid:
          type: boolean
          nullable: true
          description: |
            True if payments summed for the current cycle period >= rentAmount.
            Based on period coverage (periodStartDate/periodEndDate), NOT payment recording date.
            Used by dashboard to compute "paid this month" progress bar.

    PagedTenantResponse:
      allOf:
        - $ref: '#/components/schemas/PagedResponse'
        - type: object
          properties:
            content:
              type: array
              items:
                $ref: '#/components/schemas/TenantResponse'

    # ── Units ───────────────────────────────────────────

    RentalUnitRequest:
      type: object
      required: [ roomNumber, rentAmount ]
      properties:
        roomNumber:
          type: string
          example: A1
        description:
          type: string
          nullable: true
        rentAmount:
          type: number
          format: decimal
          example: 350000
        isAvailable:
          type: boolean
          default: true

    RentalUnitResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        roomNumber:
          type: string
        description:
          type: string
          nullable: true
        rentAmount:
          type: number
          format: decimal
        isAvailable:
          type: boolean
        createdAt:
          type: string
          format: date-time

    PagedUnitResponse:
      allOf:
        - $ref: '#/components/schemas/PagedResponse'
        - type: object
          properties:
            content:
              type: array
              items:
                $ref: '#/components/schemas/RentalUnitResponse'

    # ── Agreements ──────────────────────────────────────

    AgreementStatus:
      type: string
      enum: [ ACTIVE, TERMINATED ]

    TenantType:
      type: string
      enum: [ NEW, EXISTING ]
      description: |
        NEW = moving in fresh. Full ledger from startDate.
        EXISTING = onboarded mid-tenancy. Use openingBalance for historical arrears/credit.

    BillingModel:
      type: string
      enum: [ ADVANCE, ARREARS ]
      description: |
        ADVANCE = tenant pays at the START of each cycle. Current cycle due immediately.
        ARREARS  = tenant pays at the END of each cycle. Only completed cycles are due.

    RentalAgreementRequest:
      type: object
      required: [ tenantId, unitId ]
      properties:
        tenantId:
          type: string
          format: uuid
        unitId:
          type: string
          format: uuid
        tenantType:
          $ref: '#/components/schemas/TenantType'
          description: Defaults to NEW
        billingModel:
          $ref: '#/components/schemas/BillingModel'
          description: Defaults to ADVANCE
        startDate:
          type: string
          format: date
          nullable: true
          description: |
            NEW tenant: move-in date (required).
            EXISTING tenant: first cycle to track going forward.
            billingDay derived from this date (day of month, capped at 28).
        rentAmount:
          type: number
          format: decimal
          nullable: true
          description: Defaults to unit rentAmount if not provided.
        depositAmount:
          type: number
          format: decimal
          nullable: true
        openingBalance:
          type: number
          format: decimal
          nullable: true
          description: |
            EXISTING tenants only. Ignored for NEW tenants (always 0).
            Negative = owes arrears before startDate (increases outstanding).
            Positive = paid ahead before startDate (reduces outstanding).
          example: -540000

    MoveOutRequest:
      type: object
      required: [ moveOutDate ]
      properties:
        moveOutDate:
          type: string
          format: date

    RentalAgreementResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        tenantId:
          type: string
          format: uuid
        tenantName:
          type: string
        unitId:
          type: string
          format: uuid
        roomNumber:
          type: string
        startDate:
          type: string
          format: date
          nullable: true
        moveOutDate:
          type: string
          format: date
          nullable: true
        rentAmount:
          type: number
          format: decimal
        depositAmount:
          type: number
          format: decimal
          nullable: true
        status:
          $ref: '#/components/schemas/AgreementStatus'
        tenantType:
          $ref: '#/components/schemas/TenantType'
        openingBalance:
          type: number
          format: decimal
          description: Positive = credit, Negative = arrears. Always 0 for NEW tenants.
        billingDay:
          type: integer
          minimum: 1
          maximum: 28
          description: Day of month rent is due. Derived from startDate, never user input.
          example: 15
        billingModel:
          $ref: '#/components/schemas/BillingModel'
        createdAt:
          type: string
          format: date-time

    PagedAgreementResponse:
      allOf:
        - $ref: '#/components/schemas/PagedResponse'
        - type: object
          properties:
            content:
              type: array
              items:
                $ref: '#/components/schemas/RentalAgreementResponse'

    # ── Payments ────────────────────────────────────────

    PaymentMethod:
      type: string
      enum: [ CASH ]
      description: MVP supports CASH only. Mobile money planned for post-MVP.

    PaymentSource:
      type: string
      enum: [ CASH, ROLLOVER ]
      description: |
        CASH = manually recorded by landlord.
        ROLLOVER = auto-created by system from previous cycle overpayment.

    PeriodStatus:
      type: string
      enum: [ PAID, PARTIAL, ROLLOVER ]
      description: Computed dynamically from payment sums. Never stored.

    PaymentRequest:
      type: object
      required: [ agreementId, paymentDate, amount, method, periodStartDate, periodEndDate ]
      properties:
        agreementId:
          type: string
          format: uuid
          description: Must be an ACTIVE agreement. tenantId and unitId derived automatically.
        paymentDate:
          type: string
          format: date
          description: Date payment was physically received.
        amount:
          type: number
          format: decimal
        method:
          $ref: '#/components/schemas/PaymentMethod'
        periodStartDate:
          type: string
          format: date
          description: Start of billing cycle this payment covers. Generated by frontend cycle picker.
          example: "2026-04-15"
        periodEndDate:
          type: string
          format: date
          description: End of billing cycle. One day before next cycle start.
          example: "2026-05-14"
        reference:
          type: string
          nullable: true
          description: Mobile money transaction ID or other reference.
        notes:
          type: string
          nullable: true

    PaymentResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        agreementId:
          type: string
          format: uuid
        tenantId:
          type: string
          format: uuid
        tenantName:
          type: string
        unitId:
          type: string
          format: uuid
        roomNumber:
          type: string
        paymentDate:
          type: string
          format: date
        amount:
          type: number
          format: decimal
        method:
          $ref: '#/components/schemas/PaymentMethod'
        periodStartDate:
          type: string
          format: date
          example: "2026-04-15"
        periodEndDate:
          type: string
          format: date
          example: "2026-05-14"
        expectedAmount:
          type: number
          format: decimal
          description: rentAmount from agreement at time of payment.
        overpayment:
          type: number
          format: decimal
          description: Excess above expectedAmount. 0 if not overpaid.
        source:
          $ref: '#/components/schemas/PaymentSource'
        periodStatus:
          $ref: '#/components/schemas/PeriodStatus'
        reference:
          type: string
          nullable: true
        notes:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time

    PagedPaymentResponse:
      allOf:
        - $ref: '#/components/schemas/PagedResponse'
        - type: object
          properties:
            content:
              type: array
              items:
                $ref: '#/components/schemas/PaymentResponse'

    # ── Reports ─────────────────────────────────────────

    SummaryResponse:
      type: object
      properties:
        totalUnits:
          type: integer
        occupiedUnits:
          type: integer
        availableUnits:
          type: integer
        totalTenants:
          type: integer
        activeAgreements:
          type: integer
        terminatedAgreements:
          type: integer
        totalRevenueAllTime:
          type: number
          format: decimal
          description: Sum of all payment amounts ever recorded.

    PaymentReportResponse:
      type: object
      properties:
        from:
          type: string
          format: date
        to:
          type: string
          format: date
        totalPayments:
          type: integer
        totalAmount:
          type: number
          format: decimal

    OccupancyReportResponse:
      type: object
      properties:
        totalUnits:
          type: integer
        occupiedUnits:
          type: integer
        availableUnits:
          type: integer
        occupancyRate:
          type: number
          format: decimal
          description: Percentage 0.00–100.00

    # ── Settings ────────────────────────────────────────

    LandlordSettingsRequest:
      type: object
      description: All fields optional. Only provided fields are updated.
      properties:
        companyName:
          type: string
          nullable: true
          description: Shown in sidebar and mobile header instead of "RentFlow".
          example: Nahabwe Properties
        address:
          type: string
          nullable: true
          description: Shown on receipts.
          example: "Kyebando, Nansana, Kampala"
        receiptPrefix:
          type: string
          nullable: true
          maxLength: 10
          description: Prefix for receipt numbers. e.g. RCP → RCP-001
          example: RCP
        nextReceiptNo:
          type: integer
          nullable: true
          description: Starting number for receipts. Useful for MANUAL mode to match physical book.
          example: 1954
        receiptNumbering:
          type: string
          nullable: true
          enum: [ AUTO, MANUAL ]
          description: |
            AUTO = increments from 1 automatically.
            MANUAL = landlord sets starting number to match physical receipt book.
        receiptFooter:
          type: string
          nullable: true
          description: Message shown at bottom of every receipt.
          example: Thank you for your business
        receiptStyle:
          type: string
          nullable: true
          enum: [ DIGITAL, FORMAL ]
          description: |
            DIGITAL = clean branded receipt with dark green header.
            FORMAL = matches physical receipt book style with dotted lines.

    LandlordSettingsResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        companyName:
          type: string
          nullable: true
        address:
          type: string
          nullable: true
        logoUrl:
          type: string
          nullable: true
          description: Cloudinary secure_url. Used in sidebar, header, and receipts.
        receiptPrefix:
          type: string
          example: RCP
        nextReceiptNo:
          type: integer
          example: 7
          description: The NEXT number that will be used. Incremented after each receipt download.
        receiptNumbering:
          type: string
          enum: [ AUTO, MANUAL ]
        receiptFooter:
          type: string
          nullable: true
        receiptStyle:
          type: string
          enum: [ DIGITAL, FORMAL ]

    # ── Shared ──────────────────────────────────────────

    PagedResponse:
      type: object
      properties:
        page:
          type: integer
          example: 0
        size:
          type: integer
          example: 10
        totalElements:
          type: integer
          example: 45
        totalPages:
          type: integer
          example: 5
        last:
          type: boolean
          example: false

    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        error:
          type: string
          example: BAD_REQUEST
        message:
          type: string
          example: Unit A1 already has an active agreement